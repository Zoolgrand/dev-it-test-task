services:
  db:
    image: postgres:18-alpine
    container_name: pcs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pcs
      POSTGRES_PASSWORD: pcs
      POSTGRES_DB: product_studio
    ports:
      - "5432:5432"
    volumes:
      - pcs-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcs -d product_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcs-app
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pcs:pcs@db:5432/product_studio?schema=public
      LLM_MODE: ${LLM_MODE:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    command: sh -c "prisma migrate deploy && (prisma db seed || true) && node server.js"

volumes:
  pcs-db-data:
