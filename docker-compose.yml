services:
  db:
    image: postgres:18-alpine
    container_name: pcs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pcs
      POSTGRES_PASSWORD: pcs
      POSTGRES_DB: product_studio
    ports:
      - "5432:5432"
    volumes:
      - pcs-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcs -d product_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pcs-db-data:
