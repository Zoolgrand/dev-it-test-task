name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pcs
          POSTGRES_PASSWORD: pcs
          POSTGRES_DB: product_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcs -d product_studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pcs:pcs@localhost:5432/product_studio?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Create test database
        run: PGPASSWORD=pcs psql -h localhost -U pcs -d postgres -c "CREATE DATABASE product_studio_test"

      - name: Create e2e database
        run: PGPASSWORD=pcs psql -h localhost -U pcs -d postgres -c "CREATE DATABASE product_studio_e2e"

      - run: npx prisma generate

      - run: npx playwright install --with-deps chromium

      - run: npm run verify

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
